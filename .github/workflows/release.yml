name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # Installed from a pinned, checksum-verified tarball rather than
      # anchore/sbom-action/download-syft, whose installer resolves the tag
      # through the GitHub releases web page and fails the release when that
      # page times out. Bump SYFT_VERSION and SYFT_SHA256 together, taking the
      # hash from that release's syft_<version>_checksums.txt.
      - name: Install syft
        env:
          SYFT_VERSION: 1.57.2
          SYFT_SHA256: ad92bd3ec1b94a3df01d4d0aec199afa9c42b72e86da436ff5f837914d32706b
        run: |
          archive="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/$archive" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${archive}"
          echo "${SYFT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/syft"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/syft" syft
          echo "$RUNNER_TEMP/syft" >> "$GITHUB_PATH"
      - id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*_SHA256SUMS
      # The registries reject any release asset that is not a zip, the
      # checksums, their signature or the manifest, so the SBOM ships as a
      # signed attestation on the zips instead of a release file.
      - name: Generate SBOM
        id: sbom
        env:
          TAG: ${{ github.ref_name }}
        run: |
          sbom_path="sbom/terraform-provider-orionbelt_${TAG#v}.spdx.json"
          mkdir -p sbom
          syft scan dir:dist --output "spdx-json=$sbom_path"
          echo "path=$sbom_path" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.zip
          sbom-path: ${{ steps.sbom.outputs.path }}
